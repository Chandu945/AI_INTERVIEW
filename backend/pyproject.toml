[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Raised inside third-party libraries, not this app.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore::DeprecationWarning:google.genai.types",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, import order and bugbear (likely bugs).
select = ["E", "F", "W", "I", "B"]
# Long prompt and SQL strings are kept on one line; the formatter wraps everything else.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with calls like File(...) in defaults.
extend-immutable-calls = ["fastapi.File"]
